; Firmware fuer Baugruppe 1901 (STM32F103C8T6, DPL-02)
[env:dpl02]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
; letzte 1-KB-Flash-Seite (0x0800FC00) = Reglereinstellungen, siehe src/thermostat.c
board_upload.maximum_size = 64512
build_flags =
    -Wall -Wextra
    -DHSE_VALUE=8000000U
